version: "2"
run:
  concurrency: 4
  issues-exit-code: 1
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - gocritic
    - govet
    - misspell
    - revive
    - staticcheck
    - tagliatelle
    - whitespace
  settings:
    errcheck:
      # Every Close in this package returns nil unconditionally; the error
      # exists only so the handles satisfy io.Closer. Requiring each of the
      # hundred-odd call sites to discard it explicitly would bury the one
      # unchecked error that does matter.
      exclude-functions:
        - (*go.sia.tech/siastorage.Builder).Close
        - (*go.sia.tech/siastorage.Download).Close
        - (*go.sia.tech/siastorage.MockNetwork).Close
        - (*go.sia.tech/siastorage.Object).Close
        - (*go.sia.tech/siastorage.PackedUpload).Close
        - (*go.sia.tech/siastorage.SDK).Close
        - (*go.sia.tech/siastorage.SharedSDK).Close
        - (*go.sia.tech/siastorage.SharingKey).Close
        - (*go.sia.tech/siastorage.Upload).Close
        # Sync on a console logger returns an error on some platforms that no
        # caller can act on, which is why it is conventionally discarded.
        - (*go.uber.org/zap.Logger).Sync
    gocritic:
      disabled-checks:
        - commentedOutCode
        - uncheckedInlineErr
        # dupImport misfires on cgo, which pairs import "C" with unsafe
        - dupImport
        # dupSubExpr fires on every call to a C function taking a char** error
        # out parameter, reporting a comparison that is not on the line and a
        # column past the end of it. It comes from cgo's generated wrapper.
        - dupSubExpr
        - emptyStringTest
        - exitAfterDefer
        - ifElseChain
        - importShadow
        - initClause
        - nestingReduce
        - octalLiteral
        - paramTypeCombine
        - ptrToRefParam
        - stringsCompare
        - tooManyResultsChecker
        - typeDefFirst
        - typeUnparen
        - unlabelStmt
        - unnamedResult
        - whyNoLint
      enabled-tags:
        - diagnostic
        - style
    govet:
      disable-all: false
    revive:
      rules:
        - name: blank-imports
          disabled: false
        - name: bool-literal-in-expr
          disabled: false
        - name: confusing-naming
          disabled: false
        - name: confusing-results
          disabled: false
        - name: constant-logical-expr
          disabled: false
        - name: context-as-argument
          disabled: false
        - name: exported
          disabled: false
        - name: errorf
          disabled: false
        - name: if-return
          disabled: false
        - name: indent-error-flow
          disabled: true
        - name: increment-decrement
          disabled: false
        - name: modifies-value-receiver
          disabled: true
        - name: optimize-operands-order
          disabled: false
        - name: range-val-in-closure
          disabled: false
        - name: struct-tag
          disabled: false
        - name: superfluous-else
          disabled: false
        - name: time-equal
          disabled: false
        - name: unexported-naming
          disabled: false
        - name: unexported-return
          disabled: false
        - name: unnecessary-stmt
          disabled: false
        - name: unused-parameter
          disabled: false
        - name: unreachable-code
          disabled: false
        - name: package-comments
          disabled: true
    tagliatelle:
      case:
        rules:
          json: goCamel
          yaml: goCamel
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
